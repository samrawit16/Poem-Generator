<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/typewriter-effect@3/dist/core.js"></script>
    <title>Poem generator</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to the French poem generator</h1>
        </header>

        <main>
            <form id="poem-form">
                <input type="text" placeholder="Enter the topic of the poem you want"
                autofocus
                required
                autocomplete="off"
                class="instruction"
                >
                <input type="submit" value="Generate" class="submit-button">
            </form>
            <div class="poem" id="poem">
            </div>
        </main>

        <footer>
            It is coded by Samrawit Yisak, open source on 
            <a href="https://github.com/samrawit16/Poem-Generator" target="_blank" rel="noopener noreferrer">GitHub</a> 
        </footer>

        <script src="index.js"></script>
    </div>
</body>
</html>
